{% extends 'base.html' %}{% block content %}<section class="auth"><div class="kicker">WELCOME BACK</div><h1>Sign in</h1><p>Access your own Harvest Pool workspace.</p>
<form method="post"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Email<input name="email" type="email" autocomplete="username" required></label>
<label>Password<input name="password" type="password" autocomplete="current-password" required></label>
<button type="submit">Log in</button></form><p>New to Harvest Pool? <a href="{{ url_for('register') }}">Create an account</a></p></section>{% endblock %}
